<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f7fbff"/><stop offset="1" stop-color="#eef3f8"/>
  </linearGradient>
  <linearGradient id="esp" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#17324d"/><stop offset="1" stop-color="#244d6a"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#18334d" flood-opacity=".12"/>
  </filter>
  <style>
    .title{font:700 42px Arial,sans-serif;fill:#12263a}
    .sub{font:400 21px Arial,sans-serif;fill:#496174}
    .h{font:700 25px Arial,sans-serif;fill:#17324d}
    .txt{font:400 20px Arial,sans-serif;fill:#243b53}
    .small{font:400 17px Arial,sans-serif;fill:#52687b}
    .pin{font:700 19px Arial,sans-serif;fill:#12324b}
    .white{fill:#fff}
    .card{fill:#fff;stroke:#cfdae5;stroke-width:2;filter:url(#shadow)}
    .line{stroke:#4a6780;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .sig{stroke:#2563eb;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .power{stroke:#d97706;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .gnd{stroke:#334155;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .good{fill:#e8f5ee;stroke:#9bc9ae;stroke-width:2}
    .warn{fill:#fff6e5;stroke:#e7c477;stroke-width:2}
  </style>
</defs>
<rect width="1800" height="1320" fill="url(#bg)"/>
<text x="70" y="82" class="title">AgriSetu ESP32 + DHT22 + MQ-5 + MQ-135 + 16×2 I²C LCD</text>
<text x="70" y="122" class="sub">Wiring reference for the added MQ-135 input and LCD — existing DHT22 and MQ-5 assignments retained</text>

<!-- Main ESP32 card -->
<rect x="660" y="210" width="470" height="825" rx="28" fill="url(#esp)" filter="url(#shadow)"/>
<text x="895" y="265" text-anchor="middle" class="white" style="font:700 31px Arial">ESP32 DevKit</text>
<text x="895" y="302" text-anchor="middle" class="white" style="font:400 18px Arial;opacity:.8">GPIO / power connections</text>
<rect x="710" y="340" width="370" height="630" rx="18" fill="#f8fbff" stroke="#a9c3d7" stroke-width="2"/>
<text x="750" y="395" class="pin">3V3</text><text x="1025" y="395" text-anchor="end" class="small">DHT22 + level shifter LV</text>
<line x1="745" y1="412" x2="1045" y2="412" stroke="#d7e3ed" stroke-width="2"/>
<text x="750" y="460" class="pin">5V / VIN*</text><text x="1025" y="460" text-anchor="end" class="small">5 V rail (or external 5 V)</text>
<line x1="745" y1="477" x2="1045" y2="477" stroke="#d7e3ed" stroke-width="2"/>
<text x="750" y="525" class="pin">GND</text><text x="1025" y="525" text-anchor="end" class="small">Common ground</text>
<line x1="745" y1="542" x2="1045" y2="542" stroke="#d7e3ed" stroke-width="2"/>
<text x="750" y="590" class="pin">GPIO 4</text><text x="1025" y="590" text-anchor="end" class="small">DHT22 DATA</text>
<line x1="745" y1="607" x2="1045" y2="607" stroke="#d7e3ed" stroke-width="2"/>
<text x="750" y="655" class="pin">GPIO 34</text><text x="1025" y="655" text-anchor="end" class="small">MQ-5 divider midpoint</text>
<line x1="745" y1="672" x2="1045" y2="672" stroke="#d7e3ed" stroke-width="2"/>
<text x="750" y="720" class="pin">GPIO 35</text><text x="1025" y="720" text-anchor="end" class="small">MQ-135 divider midpoint</text>
<line x1="745" y1="737" x2="1045" y2="737" stroke="#d7e3ed" stroke-width="2"/>
<text x="750" y="785" class="pin">GPIO 21</text><text x="1025" y="785" text-anchor="end" class="small">I²C SDA (LV side)</text>
<line x1="745" y1="802" x2="1045" y2="802" stroke="#d7e3ed" stroke-width="2"/>
<text x="750" y="850" class="pin">GPIO 22</text><text x="1025" y="850" text-anchor="end" class="small">I²C SCL (LV side)</text>
<line x1="745" y1="867" x2="1045" y2="867" stroke="#d7e3ed" stroke-width="2"/>
<text x="895" y="920" text-anchor="middle" class="small">ADC pins 34 and 35 are input-only ADC1 pins</text>

<!-- Left sensor cards -->
<rect x="70" y="205" width="500" height="220" rx="22" class="card"/>
<text x="105" y="252" class="h">DHT22 — temperature &amp; humidity</text>
<text x="105" y="300" class="txt">VCC → 3V3</text>
<text x="105" y="338" class="txt">DATA → GPIO 4 (unchanged)</text>
<text x="105" y="376" class="txt">GND → common GND</text>
<text x="105" y="406" class="small">Bare 4-pin sensor: add 10 kΩ pull-up from DATA to 3V3</text>
<path d="M570 338 H625 V590 H660" class="sig"/>

<rect x="70" y="465" width="500" height="260" rx="22" class="card"/>
<text x="105" y="512" class="h">MQ-5 — methane / combustible-gas estimate</text>
<text x="105" y="560" class="txt">VCC → regulated 5 V</text>
<text x="105" y="598" class="txt">GND → common GND</text>
<text x="105" y="636" class="txt">AOUT → 1 kΩ series → GPIO 34 node</text>
<text x="105" y="674" class="txt">GPIO 34 node → 2 kΩ → GND</text>
<text x="105" y="707" class="small">DOUT unused. Original divider and MQ-5 calculation retained.</text>
<path d="M570 636 H615 V655 H660" class="sig"/>

<rect x="70" y="765" width="500" height="260" rx="22" class="card"/>
<text x="105" y="812" class="h">MQ-135 — approximate eCO₂ estimate</text>
<text x="105" y="860" class="txt">VCC → regulated 5 V</text>
<text x="105" y="898" class="txt">GND → common GND</text>
<text x="105" y="936" class="txt">AOUT → 2.2 kΩ series → GPIO 35 node</text>
<text x="105" y="974" class="txt">GPIO 35 node → 3.3 kΩ → GND</text>
<text x="105" y="1007" class="small">DOUT unused. New independent divider protects GPIO 35.</text>
<path d="M570 936 H615 V720 H660" class="sig"/>

<!-- Right upper power + shifter -->
<rect x="1210" y="205" width="520" height="205" rx="22" class="card"/>
<text x="1245" y="252" class="h">I²C bidirectional level shifter</text>
<text x="1245" y="300" class="txt">LV → ESP32 3V3; HV → 5 V rail</text>
<text x="1245" y="338" class="txt">LV SDA/SCL → GPIO 21 / GPIO 22</text>
<text x="1245" y="376" class="txt">HV SDA/SCL → LCD SDA / LCD SCL</text>
<text x="1245" y="401" class="small">GND → common GND</text>
<path d="M1130 785 H1175 V338 H1210" class="sig"/>
<path d="M1130 850 H1188 V376 H1210" class="sig"/>

<rect x="1210" y="450" width="520" height="190" rx="22" class="card"/>
<text x="1245" y="498" class="h">16×2 I²C LCD backpack</text>
<text x="1245" y="545" class="txt">VCC → 5 V; GND → common GND</text>
<text x="1245" y="583" class="txt">SDA / SCL → level shifter HV side</text>
<text x="1245" y="620" class="small">Default code address: 0x27 (sometimes 0x3F)</text>
<path d="M1470 410 V450" class="sig"/>

<rect x="1210" y="680" width="520" height="215" rx="22" class="card"/>
<text x="1245" y="728" class="h">5 V power rail</text>
<text x="1245" y="776" class="txt">Power MQ-5, MQ-135 and LCD from regulated 5 V</text>
<text x="1245" y="814" class="txt">Use a supply rated about 1 A or higher</text>
<text x="1245" y="852" class="txt">Tie supply GND to ESP32 GND</text>
<text x="1245" y="881" class="small">Do not feed 5 V analog outputs directly to ESP32 ADC pins.</text>
<path d="M1210 776 H1165 V460 H1130" class="power"/>

<!-- bottom display -->
<rect x="70" y="1070" width="1660" height="190" rx="24" class="good"/>
<text x="110" y="1120" class="h">What the LCD shows together</text>
<rect x="115" y="1142" width="670" height="82" rx="10" fill="#111827" stroke="#455568" stroke-width="3"/>
<text x="145" y="1194" fill="#a7f3d0" style="font:700 26px monospace">[thermo] T25.4C  [drop] H60%</text>
<rect x="825" y="1142" width="670" height="82" rx="10" fill="#111827" stroke="#455568" stroke-width="3"/>
<text x="855" y="1194" fill="#a7f3d0" style="font:700 26px monospace">[CO2] E0400p  [flame] M0035p</text>
<text x="1520" y="1170" class="small">p = ppm</text>
<text x="1520" y="1200" class="small">C = °C</text>
<text x="110" y="1245" class="small">The actual LCD uses four custom 5×8 symbols. Row 1: temperature and humidity. Row 2: eCO₂-equivalent and MQ-5 methane/gas estimate.</text>

<!-- legend -->
<line x1="70" y1="1292" x2="145" y2="1292" class="sig"/><text x="160" y="1299" class="small">Signal / analog path</text>
<line x1="390" y1="1292" x2="465" y2="1292" class="power"/><text x="480" y="1299" class="small">5 V supply</text>
<line x1="650" y1="1292" x2="725" y2="1292" class="gnd"/><text x="740" y="1299" class="small">Common GND</text>
<text x="1050" y="1299" class="small">*Use external regulated 5 V if the board's 5 V rail cannot supply the MQ sensor heaters.</text>
</svg>